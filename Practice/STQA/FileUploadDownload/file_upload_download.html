<!DOCTYPE html>
<html>
<head>
    <title>File Upload and Download</title>
</head>
<body>


<h2>File Upload</h2>


<input type="file" id="fileUpload">
<button onclick="uploadFile()" id="uploadBtn">Upload</button>


<p id="uploadStatus"></p>


<hr>


<h2>File Download</h2>


<a href="sample.txt" download>
    <button id="downloadBtn">Download File</button>
</a>


<script>
    function uploadFile(){
        const file = document.getElementById("fileUpload")
        if(file){
            document.getElementById("uploadStatus").innerHTML = "File uploaded Successfully"
        }else{
            document.getElementById("uploadStatus").innerHTML = "File upload Failed"
           
        }
    }
</script>


</body>
</html>
