<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Web Table</title>
</head>
<body>

<h2>Student Marks</h2>

<input type="text" id="search" placeholder="Search student">

<table id="studentTable" border="1">
    <thead>
        <tr>
            <th onclick="sortTable(0)">Student Name</th>
            <th onclick="sortTable(1)">Java</th>
            <th onclick="sortTable(2)">DBMS</th>
        </tr>
    </thead>

    <tbody>
        <tr><td>Rahul</td><td>75</td><td>55</td></tr>
        <tr><td>Priya</td><td>45</td><td>70</td></tr>
        <tr><td>Amit</td><td>85</td><td>80</td></tr>
        <tr><td>Neha</td><td>60</td><td>65</td></tr>
        <tr><td>Rohan</td><td>90</td><td>88</td></tr>
    </tbody>
</table>

<script>
function sortTable(column) {
    let table = document.getElementById("studentTable");
    let rows = Array.from(table.rows).slice(1);

    rows.sort((a, b) => {
        let x = a.cells[column].innerText;
        let y = b.cells[column].innerText;

        if (!isNaN(x) && !isNaN(y)) {
            return Number(x) - Number(y);
        }

        return x.localeCompare(y);
    });

    let tbody = table.querySelector("tbody");

    rows.forEach(row => tbody.appendChild(row));
}

document.getElementById("search").addEventListener("keyup", function () {
    let filter = this.value.toLowerCase();
    let rows = document.querySelectorAll("#studentTable tbody tr");

    rows.forEach(row => {
        let text = row.innerText.toLowerCase();
        row.style.display = text.includes(filter) ? "" : "none";
    });
});
</script>

</body>
</html>
